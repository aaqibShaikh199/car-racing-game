# =================================================================
# F1 Racing Car – Kubernetes Service
# Gives the pods one stable address and load-balances between them.
#
# Type NodePort opens port 30080 on every cluster node, which is the
# simplest way to reach the app from outside on a local cluster.
# On a cloud cluster you can change "type" to LoadBalancer.
# =================================================================
apiVersion: v1
kind: Service
metadata:
  name: f1-racing-car
  labels:
    app: f1-racing-car
spec:
  type: NodePort
  selector:
    app: f1-racing-car       # sends traffic to pods with this label
  ports:
    - name: http
      protocol: TCP
      port: 80               # port inside the cluster
      targetPort: http       # the container's named port (8080)
      nodePort: 30080        # port on each node (range 30000-32767)
