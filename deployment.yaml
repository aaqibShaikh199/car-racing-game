# =================================================================
# F1 Racing Car – Kubernetes Deployment
# Runs 2 copies (pods) of the Nginx container and keeps them healthy.
# =================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-racing-car
  labels:
    app: f1-racing-car
spec:
  replicas: 2                      # two pods = no downtime if one restarts
  revisionHistoryLimit: 3          # keep a few old versions for rollbacks
  selector:
    matchLabels:
      app: f1-racing-car           # must match the pod labels below
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never drop below 2 ready pods during updates
      maxSurge: 1
  template:
    metadata:
      labels:
        app: f1-racing-car
    spec:
      automountServiceAccountToken: false   # the app never talks to the K8s API
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # For a local cluster, load this image into it first (see README).
          # For a real cluster, use your registry path, e.g.
          # docker.io/<your-user>/f1-racing-car:1.0.0
          image: f1-racing-car:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:              # what the scheduler reserves
              cpu: 25m
              memory: 32Mi
            limits:                # hard ceiling
              cpu: 200m
              memory: 128Mi
          readinessProbe:          # only send traffic once Nginx answers
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:           # restart the container if it stops answering
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # nobody can modify files in the container
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Nginx needs one writable folder for its PID file and temp files
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
